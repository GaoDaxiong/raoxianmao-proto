<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2c3f4c">
<meta name="screen-orientation" content="landscape"><meta name="x5-orientation" content="landscape"><meta name="x5-fullscreen" content="true"><meta name="full-screen" content="yes">
<meta name="rxm-version" content="v6-ears-U">
<title>团绒 · 五种耳朵的旅行</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%90%B0%3C/text%3E%3C/svg%3E">
<style>
  :root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);--ink:#4e3a26;--gold:#e2a644;--cream:#fffaf0;--font:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif;}
  html,body{margin:0;height:100%;overflow:hidden;background:#86c8ec;font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;}
  #stage{position:fixed;left:0;top:0;width:100vw;height:100vh;transform-origin:0 0;overflow:hidden;}
  canvas{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;display:block;}
  .ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;text-align:center;z-index:5;}
  .ov.show{display:flex;animation:fadeIn .6s ease both;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes shimmer{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes bob{0%,100%{box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 -2px 0 rgba(150,80,20,.35) inset,0 8px 22px rgba(40,30,10,.35),0 0 0 4px rgba(255,248,226,.28)}50%{box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 -2px 0 rgba(150,80,20,.35) inset,0 8px 22px rgba(40,30,10,.35),0 0 0 9px rgba(255,248,226,.12),0 0 30px rgba(255,220,140,.6)}}
  /* title */
  #start{justify-content:center;align-items:flex-start;padding:0 0 0 calc(7% + var(--sal));box-sizing:border-box;pointer-events:none;
    background:linear-gradient(90deg,rgba(255,246,214,.62) 0%,rgba(255,246,214,.25) 38%,rgba(20,40,40,0) 58%),linear-gradient(0deg,rgba(16,34,36,.4) 0%,rgba(16,34,36,0) 30%);}
  #start .crest,#start .foot{align-items:flex-start;text-align:left;}
  #start .foot{margin-top:18px;}
  #start > *{pointer-events:auto;}
  .crest{display:flex;flex-direction:column;align-items:center;animation:rise 1s .1s ease both;}
  .orn{display:flex;align-items:center;gap:10px;color:rgba(110,80,40,.75);font-size:11px;letter-spacing:.5em;font-weight:600;}
  .orn i{display:block;width:46px;height:1px;background:linear-gradient(90deg,transparent,rgba(120,85,40,.7));}
  .orn i:last-child{transform:scaleX(-1);}
  .orn b{width:6px;height:6px;transform:rotate(45deg);border:1px solid rgba(120,85,40,.8);}
  #start h1{margin:10px 0 4px;font-size:42px;font-weight:900;letter-spacing:.14em;text-indent:.14em;color:#fffdf4;white-space:nowrap;
    text-shadow:0 2px 0 #6f9fd0,0 3px 1px rgba(140,60,20,.35),0 8px 22px rgba(70,40,20,.4),0 0 40px rgba(158,195,234,.9);}
  .tag{font-size:12px;letter-spacing:.42em;text-indent:.42em;color:#5d4226;font-weight:700;padding:5px 14px;border-radius:999px;background:rgba(255,250,232,.55);border:1px solid rgba(170,130,70,.3);}
  .foot{display:flex;flex-direction:column;align-items:center;animation:rise 1s .4s ease both;}
  #startSub{margin:0 0 4px;font-size:16px;color:#4a3420;text-shadow:0 1px 0 rgba(255,250,230,.7);font-weight:600;letter-spacing:.12em;text-shadow:0 1px 6px rgba(0,0,0,.45);}
  #startSub2{margin:0;font-size:13px;color:rgba(74,52,32,.78);letter-spacing:.1em;}
  #startSub,#startSub2{text-shadow:0 1px 0 rgba(255,250,230,.7);}
  .btn{position:relative;margin-top:22px;padding:15px 50px;border-radius:999px;border:1px solid rgba(255,240,200,.9);font-family:inherit;font-size:18px;font-weight:800;letter-spacing:.32em;text-indent:.32em;cursor:pointer;
    color:#fff;background:linear-gradient(180deg,#f8cd72 0%,#eda447 55%,#d98634 100%);text-shadow:0 1px 0 rgba(140,70,20,.5);
    box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 -2px 0 rgba(150,80,20,.35) inset,0 8px 22px rgba(40,30,10,.35),0 0 0 4px rgba(255,248,226,.28);transition:transform .12s;}
  .btn:active{transform:translateY(2px) scale(.98);}
  .btn::before,.btn::after{content:"";position:absolute;top:50%;width:6px;height:6px;margin-top:-3px;transform:rotate(45deg);background:rgba(255,255,255,.85);}
  .btn::before{left:20px}.btn::after{right:20px}
  .btn.ghost{background:rgba(255,252,244,.12);color:inherit;border:1px solid currentColor;box-shadow:none;font-weight:600;font-size:14px;letter-spacing:.2em;padding:10px 26px;margin-top:12px;text-shadow:none;opacity:.85;}
  .btn.ghost::before,.btn.ghost::after,.btn.small::before,.btn.small::after{display:none}
  .pulse{animation:bob 2.4s ease-in-out infinite;}
  /* HUD bits */
  #muteBtn{position:absolute;top:12px;right:calc(14px + var(--sar));width:42px;height:42px;border-radius:50%;z-index:8;border:1px solid rgba(190,150,90,.35);
    background:rgba(255,252,244,.82);box-shadow:0 4px 14px rgba(20,40,30,.25);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;}
  #muteBtn svg{width:20px;height:20px;}
  #muteBtn .x{display:none}#muteBtn.off .x{display:inline}#muteBtn.off .w{display:none}
  #hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;z-index:4;pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .6s,transform .6s;}
  #hint.show{opacity:1;transform:none;}
  #hint span{display:inline-flex;align-items:center;gap:10px;background:rgba(255,252,244,.92);color:var(--ink);padding:10px 20px 10px 16px;border-radius:22px;font-size:13px;max-width:380px;text-align:left;line-height:1.35;font-weight:600;letter-spacing:.08em;
    border:1px solid rgba(200,160,90,.45);box-shadow:0 6px 20px rgba(20,40,30,.22);}
  #hint span::before{content:"";width:7px;height:7px;transform:rotate(45deg);background:var(--gold);box-shadow:0 0 8px rgba(255,200,90,.9);animation:shimmer 1.6s infinite;}
  /* reveal word */
  #word{justify-content:flex-end;padding-bottom:calc(14px + var(--sab));box-sizing:border-box;pointer-events:none;color:#fff2e4;background:transparent;}
  #word > *{pointer-events:auto;}
  #msg .big{font-size:34px;font-weight:900;letter-spacing:.2em;color:#fff;text-shadow:0 0 24px rgba(158,195,234,.95),0 2px 0 #6f9fd0}#msg .hrt{color:#9ec3ea}
  #msg{min-height:30px;font-size:18px;line-height:1.6;margin:0 120px 2px;white-space:pre-wrap;font-weight:600;letter-spacing:.12em;text-shadow:0 0 18px rgba(120,180,240,.7),0 1px 2px rgba(0,0,0,.4);}
  #from{font-size:13px;opacity:.6;margin-bottom:4px;}
  #stats{display:flex;gap:16px;font-size:13px;margin-bottom:8px;color:#e8f2ff;text-shadow:0 1px 3px rgba(0,0,0,.5);}#stats b{font-size:15px;color:#fff}
  #wordBtns{margin-top:0;opacity:0;transition:opacity .8s;display:flex;flex-direction:row;align-items:center;gap:14px;pointer-events:none;}
  #wordBtns .btn{margin-top:4px;}
  #wordBtns.show{opacity:1;pointer-events:auto;}
  /* customize (parchment) */
  #custom{color:var(--ink);justify-content:flex-start;padding:22px calc(20px + var(--sar)) 20px calc(20px + var(--sal));box-sizing:border-box;overflow-y:auto;
    background:radial-gradient(120% 70% at 50% 0%,#fffdf6 0%,#f8edd4 55%,#efdcb6 100%);}
  #custom::before{display:none;content:"";position:absolute;inset:10px;border:1px solid rgba(170,130,70,.35);border-radius:22px;pointer-events:none;}
  #custom h2{margin:4px 0 4px;font-size:22px;font-weight:900;letter-spacing:.24em;text-indent:.24em;}
  .cgrid{display:flex;gap:14px;justify-content:center;align-items:stretch;flex-wrap:wrap;}
  .cbtns{display:flex;gap:14px;align-items:center;justify-content:center;}
  .cbtns .btn{margin-top:4px;}
  #custom .sub{font-size:13px;opacity:.7;margin-bottom:12px;letter-spacing:.06em;}
  .card{background:rgba(255,255,255,.72);border-radius:18px;padding:12px 14px;width:min(44%,340px);min-width:260px;box-sizing:border-box;border:1px solid rgba(200,160,100,.35);
    box-shadow:0 1px 0 #fff inset,0 8px 24px rgba(120,80,30,.12);text-align:left;margin-bottom:14px;}
  .card label{font-size:12px;opacity:.7;display:block;margin-bottom:8px;letter-spacing:.12em;font-weight:700;}
  .row{display:flex;gap:8px;align-items:center;}
  #wIn{flex:1;font-size:26px;font-weight:800;letter-spacing:6px;text-transform:uppercase;padding:8px 12px;border:1.5px solid #e8d2ad;border-radius:12px;background:#fffdf8;color:#d0392f;font-family:inherit;min-width:0;outline:none;}
  #wIn:focus,#mIn:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(226,166,68,.2);}
  #heartBtn{font-size:22px;width:48px;height:48px;border-radius:12px;border:1.5px solid #f2b5a8;background:#fff0ec;color:#e0403a;}
  #mIn{width:100%;box-sizing:border-box;font-size:16px;padding:8px 12px;border:1.5px solid #e8d2ad;border-radius:12px;resize:none;height:48px;font-family:inherit;background:#fffdf8;color:var(--ink);outline:none;}
  .cnt{font-size:12px;opacity:.55;text-align:right;margin-top:4px;}
  #linkBox{display:none;}
  #link{width:100%;box-sizing:border-box;font-size:13px;padding:9px;border:1.5px dashed #e0c08f;border-radius:10px;background:#fffdf8;color:#7a5a40;}
  #toast{position:absolute;left:50%;top:86%;max-width:56%;text-align:center;transform:translate(-50%,-50%);background:rgba(40,34,30,.86);color:#fff;padding:9px 20px;border-radius:999px;font-size:14px;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none;letter-spacing:.06em;}
  #toast.show{opacity:1;}
  .err{color:#d0453a;font-size:13px;min-height:18px;margin-top:4px;}
</style>
</head>
<body>
<div id="stage">
<canvas id="cv"></canvas>
<div id="hint"><span id="hintText"></span></div>
<button id="muteBtn" aria-label="声音"><svg viewBox="0 0 24 24" fill="none" stroke="#6b4e2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h3l5-4v14l-5-4H4z" fill="#f0c56e"/><path class="w" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/><path class="x" d="M16 9l5 6M21 9l-5 6"/></svg></button>

<div id="start" class="ov">
  <div class="crest">
    <div class="orn"><i></i><b></b><span>TUANRONG · FIVE EARS</span><b></b><i></i></div>
    <h1>团绒</h1>
    <div class="tag">五种耳朵的旅行</div>
  </div>
  <div class="foot">
    <p id="startSub">吃下彩色光点，团绒的耳朵会变成钻头、灯笼、小伞、弹簧和铃铛</p>
    <p id="startSub2">穿过五个地方，打败大雾怪 · 终点有个小惊喜</p>
    <button class="btn pulse" id="startBtn">开始</button>
  </div>
</div>

<div id="word" class="ov">
  <div id="msg"></div>
  <div id="from"></div>
  <div id="stats"></div>
  <div id="wordBtns">
    <button class="btn" id="makeBtn">我也写一个</button>
    <button class="btn ghost" id="replayBtn">重看一遍</button>
    <button class="btn ghost" id="againBtn">再玩一次</button>
  </div>
</div>

<div id="custom" class="ov">
  <div class="orn"><i></i><b></b><i></i></div>
  <h2>写一个词送给 TA</h2>
  <div class="sub">TA 要先陪团绒跑到终点，才会看到你点亮的字</div>
  <div class="cgrid">
  <div class="card"><label>试玩关 · 团绒会替你跑出一个 U，揭晓时显示 I ❤ U</label><div style="font-size:30px;font-weight:900;letter-spacing:8px;color:#5f8fc4">I ❤ U</div></div>
  <div class="card">
    <label>想说的话 · 可选</label>
    <textarea id="mIn" maxlength="40" placeholder="比如：生日快乐！"></textarea>
    <div class="cnt"><span id="mCnt">0</span>/40</div>
  </div>
  </div>
  <div class="cbtns"><button class="btn ghost" id="backBtn">返回</button><button class="btn" id="genBtn">生成分享链接</button></div>
  <div class="card" id="linkBox" style="margin-top:12px;width:min(90%,560px)">
    <label>把这个链接发给 TA</label>
    <input id="link" readonly>
    <div class="row" style="margin-top:10px;justify-content:center;gap:10px">
      <button class="btn small" id="copyBtn" style="margin-top:0;padding:11px 26px;font-size:15px;letter-spacing:.16em">复制链接</button>
      <button class="btn ghost" id="tryBtn" style="margin-top:0">自己先玩</button>
    </div>
  </div>
</div>
<div id="toast"></div>
</div>

<script src="js/audio.js?v=6.0"></script>
<script src="js/v6/letters.js?v=6.0"></script>
<script src="js/v6/sim.js?v=6.0"></script>
<script src="js/v6/bot.js?v=6.0"></script>
<script src="js/v6/render.js?v=6.0"></script>
<script src="js/v6/main.js?v=6.0"></script>
</body>
</html>
